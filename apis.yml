aid: farmwise
name: Farmwise
description: 'FarmWise Labs is an agricultural technology company building AI-powered
  robotics for specialty crop farming. Its flagship product, Vulcan, is an intra-row
  weeder and precision cultivator that uses computer vision and machine learning to
  identify and mechanically remove weeds without herbicides, covering up to three acres
  per hour and saving growers an estimated $250+ per acre. The self-calibrating machine
  operates in all field conditions and receives over-the-air software updates. Founded
  in San Francisco and backed by GV (Google Ventures), FarmWise is added to the API
  Evangelist network as a company profile; it currently publishes no public API,
  developer portal, or specification surface.'
